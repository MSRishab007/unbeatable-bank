name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "docs/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protos:
    # Fails if someone edits a .proto without regenerating the committed stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install grpcio-tools==1.68.1
      - run: python scripts/gen_protos.py
      - run: git diff --exit-code -- libs/common/ubproto

  manifests:
    # Fails if deploy/bank does not match scripts/gen_manifests.py, and checks every manifest's schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/gen_manifests.py
      - run: git diff --exit-code -- deploy/bank
      - name: Validate Kubernetes manifests
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in deploy/bank deploy/kafka deploy/monitoring; do
            kubectl kustomize "$dir" | ./kubeconform -strict -summary -schema-location default -schema-location "$CRDS" -
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - name: Validate every layer (no cloud access needed)
        run: |
          for layer in bootstrap main platform; do
            terraform -chdir=infra/$layer init -backend=false -input=false
            terraform -chdir=infra/$layer validate
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ledger, account, intake, dynastore, ratelimit, risk, identity, gateway, fraud, deposits]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/common/pyproject.toml
            services/*/requirements*.txt
      - name: Install the shared library and every service's dependencies
        run: |
          pip install -e "libs/common[kafka]"
          cat services/*/requirements.txt | sort -u > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt pytest==8.3.4
      - name: Raise Postgres connection limit (concurrency tests open many connections)
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -q && break; sleep 1; done
      - run: pytest -q
        working-directory: services/${{ matrix.service }}
        env:
          TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r functions/notification/requirements.txt pytest==8.3.4
      - run: pytest -q
        working-directory: functions/notification

  flink-sql:
    # Runs the real Flink SQL of the Audit Analytics job on a local mini-cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/audit-analytics/requirements-dev.txt
      - run: pip install -r services/audit-analytics/requirements-dev.txt
      - run: pytest -q tests
        working-directory: services/audit-analytics

  images:
    # Every image must build. Pushing happens in release.yml on main.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ledger, account, intake, dynastore, ratelimit, risk, identity, gateway, fraud, deposits]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
