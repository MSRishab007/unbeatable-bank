name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["deploy/**", "docs/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protos:
    # Fails if someone edits a .proto without regenerating the committed stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install grpcio-tools==1.68.1
      - run: python scripts/gen_protos.py
      - run: git diff --exit-code -- libs/common/ubproto

  web:
    # The customer app (web/, React). Type-checks and builds it; the gateway serves the build
    # committed in services/gateway/static, so a stale one is flagged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Is the committed build up to date?
        run: |
          if ! git diff --quiet -- services/gateway/static; then
            echo "::warning::services/gateway/static differs from a fresh build of web/. Run 'make web' and commit."
            git status --short -- services/gateway/static | head -20
          fi

  manifests:
    # Fails if deploy/bank does not match scripts/gen_manifests.py, and checks every manifest's schema.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/gen_manifests.py
      - run: git diff --exit-code -- deploy/bank deploy/edge && test -z "$(git status --porcelain -- deploy/bank deploy/edge)"
      - name: Validate Kubernetes manifests
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in deploy/bank deploy/edge deploy/kafka deploy/monitoring; do
            kubectl kustomize "$dir" | ./kubeconform -strict -summary -schema-location default -schema-location "$CRDS" -
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - name: Validate every layer (no cloud access needed)
        run: |
          for layer in bootstrap main platform; do
            terraform -chdir=infra/$layer init -backend=false -input=false
            terraform -chdir=infra/$layer validate
          done

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ledger, account, intake, dynastore, ratelimit, risk, identity, gateway, fraud, deposits]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/common/pyproject.toml
            services/*/requirements*.txt
      - name: Install the shared library and every service's dependencies
        run: |
          pip install -e "libs/common[kafka]"
          cat services/*/requirements.txt | sort -u > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt pytest==8.3.4 pypdf==5.1.0
      - name: Raise Postgres connection limit (concurrency tests open many connections)
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -q && break; sleep 1; done
      - run: pytest -q
        working-directory: services/${{ matrix.service }}
        env:
          TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

  e2e:
    # Starts every service as a plain process (no Docker, no Kafka) and drives the whole
    # bank through the gateway: API smoke test, fraud personas, then the web app in Chromium.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/common/pyproject.toml
            services/*/requirements*.txt
      - name: Install dependencies
        run: |
          pip install -e "libs/common[kafka]"
          cat services/*/requirements.txt | sort -u > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt httpx playwright
          bash scripts/ci_install_browser.sh
      - name: Create the databases
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U postgres -c "ALTER SYSTEM SET max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do pg_isready -h localhost -q && break; sleep 1; done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f infra/local/postgres-init.sql
        env:
          PGPASSWORD: postgres
      - name: Start the bank
        run: |
          nohup python scripts/dev_stack.py > /tmp/stack.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/healthz > /dev/null && exit 0; sleep 2; done
          cat /tmp/stack.log; exit 1
      - run: python scripts/smoke_test.py
      - run: python loadtest/simulator.py
      - run: python scripts/ui_test.py --shots /tmp/shots
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            /tmp/shots
            /tmp/stack.log
            .dev/logs
          if-no-files-found: ignore

  adapters:
    # The shared library's cloud adapters, tested against Google's emulators: Firestore,
    # Pub/Sub and Cloud Storage must behave like the local stand-ins the services are tested with.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GCP_PROJECT: test-project
      FIRESTORE_EMULATOR_HOST: localhost:8085
      PUBSUB_EMULATOR_HOST: localhost:8086
      STORAGE_EMULATOR_HOST: http://localhost:4443
      TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REQUIRE_ALL_BACKENDS: "1"          # a skipped backend fails the job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: libs/common/pyproject.toml
      - name: Start the emulators
        run: |
          EMULATORS=gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
          docker run -d --name firestore -p 8085:8085 $EMULATORS \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8085 --project=$GCP_PROJECT
          docker run -d --name pubsub -p 8086:8086 $EMULATORS \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8086 --project=$GCP_PROJECT
          docker run -d --name gcs -p 4443:4443 fsouza/fake-gcs-server:1.52.2 \
            -scheme http -port 4443 -backend memory -public-host localhost:4443
          for port in 8085 8086 4443; do
            for i in $(seq 1 60); do
              curl -s -o /dev/null "http://localhost:$port/" && continue 2
              sleep 2
            done
            echo "emulator on port $port did not start"; docker logs firestore; docker logs pubsub; docker logs gcs; exit 1
          done
      - run: pip install -e "libs/common[gcp]" "psycopg[binary]==3.2.3" psycopg-pool==3.2.4 fastapi==0.115.6 httpx==0.28.1 pytest==8.3.4
      - run: pytest -q -rs libs/common/tests

  compose-e2e:
    # The real thing on one machine: every image built from the Dockerfile GKE uses, real Kafka,
    # then the API smoke test, the fraud personas, the web app in Chromium, and a node failure.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start the bank
        run: |
          docker compose up --build -d
          for i in $(seq 1 150); do curl -sf localhost:8080/healthz > /dev/null && break; sleep 2; done
          curl -sf localhost:8080/healthz
          docker compose ps
      - name: Every container is running
        run: |
          # kafka-init is a one-shot job; everything else must be up.
          diff <(docker compose config --services | grep -v '^kafka-init$' | sort) \
               <(docker compose ps --services --status running | sort)
      - run: pip install httpx playwright && bash scripts/ci_install_browser.sh
      - name: API smoke test
        run: python scripts/smoke_test.py
      - name: Fraud personas
        run: python loadtest/simulator.py
      - name: Web app in a browser
        run: python scripts/ui_test.py --shots /tmp/shots
      - name: Payment events went through Kafka
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic txn-events --from-beginning \
            --max-messages 20 --timeout-ms 20000 > /tmp/txn-events.txt
          test "$(wc -l < /tmp/txn-events.txt)" -ge 20
          head -c 600 /tmp/txn-events.txt
      - name: One DynaStore node dies, the bank keeps working
        run: |
          docker compose stop dyna-1
          python scripts/smoke_test.py --skip-eod
          docker compose start dyna-1
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q dyna-1)")" = healthy ] && break
            sleep 2
          done
          python scripts/smoke_test.py --skip-eod
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 150 > /tmp/compose.log 2>&1; docker compose ps -a
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e
          path: |
            /tmp/shots
            /tmp/compose.log
          if-no-files-found: ignore

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r functions/notification/requirements.txt pytest==8.3.4
      - run: pytest -q
        working-directory: functions/notification

  flink-sql:
    # Runs the real Flink SQL of the Audit Analytics job on a local mini-cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/audit-analytics/requirements-dev.txt
      - run: pip install -r services/audit-analytics/requirements-dev.txt
      - run: pytest -q tests
        working-directory: services/audit-analytics

  images:
    # Every image must build. Pushing happens in release.yml on main.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ledger, account, intake, dynastore, ratelimit, risk, identity, gateway, fraud, deposits]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
