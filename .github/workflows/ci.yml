name: CI

on:
  pull_request:
    paths: ["services/**", "proto/**", "scripts/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["services/**", "proto/**", "scripts/**", ".github/workflows/ci.yml"]

jobs:
  protos:
    # Fails if someone edits a .proto without regenerating the committed stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install grpcio-tools==1.68.1
      - run: python scripts/gen_protos.py
      - run: git diff --exit-code -- services/*/app/gen

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ledger, account, intake]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Docker image builds
        run: docker build -t ${{ matrix.service }}:ci .
