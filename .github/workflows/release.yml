name: Release

# Builds every service image, pushes it to Artifact Registry and opens a pull
# request that writes the new image tag into deploy/bank/kustomization.yaml.
# Merging that pull request is the deployment: ArgoCD sees the change on main and
# rolls the pods. Nothing is deployed by this workflow itself (GitOps), and main
# can stay protected (changes only through pull requests).
#
# One-time setting for the pull request: Settings -> Actions -> General ->
#   "Allow GitHub Actions to create and approve pull requests" (on).
#
# One-time setup (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID      e.g. unbeatable-bank-12
#   GCP_REGION          e.g. us-central1
#   WIF_PROVIDER        output `github_wif_provider` of infra/bootstrap
#   CI_SERVICE_ACCOUNT  output `github_ci_service_account` of infra/bootstrap
# No keys are stored in GitHub: it authenticates with Workload Identity Federation.

on:
  push:
    branches: [main]
    paths: ["services/**", "libs/**", "proto/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/unbeatable

jobs:
  images:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: [ledger, account, intake, dynastore, ratelimit, risk, identity, gateway, fraud, deposits]
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the deploy/<sha> branch
      pull-requests: write     # open the pull request
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Point the manifests at the new images
        run: python scripts/gen_manifests.py --registry "$REGISTRY" --tag "${{ github.sha }}"
      - name: Open the deploy pull request (merging it is what ArgoCD deploys)
        run: |
          short="${GITHUB_SHA::7}"
          branch="deploy/$short"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/bank
          if git diff --cached --quiet; then echo "Images are already deployed: nothing to change."; exit 0; fi
          git switch -c "$branch"
          git commit -m "deploy: $short"
          git push --force origin "$branch"

          # An older release that was never merged is out of date now: close it.
          for old in $(gh pr list --state open --json headRefName --jq '.[] | select(.headRefName | startswith("deploy/")) | .headRefName'); do
            [ "$old" = "$branch" ] || gh pr close "$old" --delete-branch --comment "Superseded by $branch."
          done

          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "Pull request for $branch already open."
          else
            gh pr create --base main --head "$branch" --title "deploy: $short" --body "$(printf '%s\n' \
              "Images built from $GITHUB_SHA are in Artifact Registry." \
              "" \
              "Merging this pull request deploys them: ArgoCD applies \`deploy/bank\` from \`main\`." \
              "Only image tags change here; the code itself was reviewed when it was merged." \
              "" \
              "Build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          fi
          echo "### Merge the pull request \`deploy: $short\` to deploy" >> "$GITHUB_STEP_SUMMARY"
