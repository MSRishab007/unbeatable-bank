# cert-manager: obtains the Let's Encrypt certificate for the bank's public names and
# renews it. It stores it in the Secret bank/bank-tls, which every Traefik pod reads.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.20.0
    helm:
      valuesObject:
        crds:
          enabled: true
          keep: true          # deleting the app must not delete every certificate with the CRDs
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 256Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
        cainjector:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
