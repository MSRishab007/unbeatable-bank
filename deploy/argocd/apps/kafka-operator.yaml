apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.45.*
    helm:
      valuesObject:
        # Strimzi copies the Kafka object's labels onto everything it creates. ArgoCD's
        # label (argocd.argoproj.io/instance: kafka) then landed on the ClusterRoleBinding
        # the broker's init container needs; being cluster-wide it can't have the Kafka
        # object as owner, so ArgoCD pruned it as a stray and Kafka never started
        # ("cannot get resource nodes"). Strimzi's default exclusions plus ArgoCD's labels:
        labelsExclusionPattern: "^app.kubernetes.io/(?!part-of).*|^kustomize.toolkit.fluxcd.io.*|^argocd.argoproj.io/.*"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
