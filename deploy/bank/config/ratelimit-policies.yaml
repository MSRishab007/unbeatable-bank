# Rate-limit policies. Mounted from a ConfigMap, so limits are changed through Git (GitOps).
#
# Each scope has one or more rules: at most `limit` permits per `window` seconds.
# `lease` (optional) lets each coordinator pod take that many permits from the shared
# store at a time and hand them out locally, trading a little accuracy for far fewer
# store round-trips on very hot keys.

# When the store is unreachable: payments up to this amount (paise) are allowed,
# larger ones are refused. Small payments fail open, large ones fail closed.
fail_open_max_amount: 200000   # Rs 2,000

policy_sets:
  payments:
    customer:
      - { limit: 10, window: 60 }
      - { limit: 100, window: 3600 }
    account:
      - { limit: 10, window: 60 }
    device:
      - { limit: 20, window: 60 }
    ip:
      - { limit: 120, window: 60, lease: 10 }
  login:
    identity:                       # per email / phone: slows password guessing
      - { limit: 5, window: 300 }
    ip:
      - { limit: 30, window: 60 }
