apiVersion: batch/v1
kind: CronJob
metadata:
  name: dns-updater
  labels:
    app: dns-updater
    app.kubernetes.io/part-of: unbeatable-bank
spec:
  schedule: '*/2 * * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app: dns-updater
            app.kubernetes.io/part-of: unbeatable-bank
        spec:
          restartPolicy: Never
          serviceAccountName: dns-updater
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: update
            image: curlimages/curl:8.11.1
            command:
            - sh
            - -c
            - |
              set -eu
              api=https://kubernetes.default.svc
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              ip=$(curl -sf --cacert $sa/ca.crt -H "Authorization: Bearer $(cat $sa/token)" \
                $api/api/v1/namespaces/bank/services/edge | sed -n 's/.*"ip": *"\([0-9.]*\)".*/\1/p' | head -n1)
              if [ -z "$DUCKDNS_TOKEN" ]; then echo "no DUCKDNS_TOKEN in bank-secrets: nothing to do"; exit 0; fi
              if [ -z "$ip" ]; then echo "the load balancer has no IP yet"; exit 0; fi
              answer=$(curl -sf "https://www.duckdns.org/update?domains=$DOMAINS&token=$DUCKDNS_TOKEN&ip=$ip")
              echo "$DOMAINS -> $ip: $answer"
              [ "$answer" = "OK" ]
            env:
            - name: DOMAINS
              value: unbeatable-bank,ubank
            - name: DUCKDNS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bank-secrets
                  key: DUCKDNS_TOKEN
                  optional: true
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                memory: 192Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
