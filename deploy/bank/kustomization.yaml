# Generated by scripts/gen_manifests.py, except `images`, which the release workflow
# rewrites on every merge to main (that commit is what ArgoCD deploys).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank
resources:
- common.yaml
- dynastore.yaml
- gateway.yaml
- identity.yaml
- account.yaml
- ledger.yaml
- intake.yaml
- ratelimit.yaml
- risk.yaml
- fraud.yaml
- deposits.yaml
configMapGenerator:
- name: ratelimit-config
  files:
  - policies.yaml=config/ratelimit-policies.yaml
- name: risk-config
  files:
  - rules.yaml=config/risk-rules.yaml
images:
- name: unbeatable/dynastore
  newName: REGISTRY/dynastore
  newTag: latest
- name: unbeatable/gateway
  newName: REGISTRY/gateway
  newTag: latest
- name: unbeatable/identity
  newName: REGISTRY/identity
  newTag: latest
- name: unbeatable/account
  newName: REGISTRY/account
  newTag: latest
- name: unbeatable/ledger
  newName: REGISTRY/ledger
  newTag: latest
- name: unbeatable/intake
  newName: REGISTRY/intake
  newTag: latest
- name: unbeatable/ratelimit
  newName: REGISTRY/ratelimit
  newTag: latest
- name: unbeatable/risk
  newName: REGISTRY/risk
  newTag: latest
- name: unbeatable/fraud
  newName: REGISTRY/fraud
  newTag: latest
- name: unbeatable/deposits
  newName: REGISTRY/deposits
  newTag: latest
