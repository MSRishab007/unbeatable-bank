# Grafana picks up any ConfigMap labelled grafana_dashboard (dashboard sidecar).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: bank-overview-dashboard
    files:
      - bank-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
