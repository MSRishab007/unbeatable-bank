// Ledger service gRPC contract. Used on the payment hot path (Transaction Intake -> Ledger).
//
// Errors are returned as gRPC status codes, with a machine-readable code in the
// "error-code" trailing metadata (e.g. INSUFFICIENT_FUNDS, ACCOUNT_NOT_OPEN).
//
// After editing this file run:  python scripts/gen_protos.py

syntax = "proto3";

package unbeatable.ledger.v1;

service LedgerService {
  // Post a balanced journal. Retrying with the same idempotency_key is safe:
  // the original journal is returned with replayed = true.
  rpc PostJournal(PostJournalRequest) returns (PostJournalResponse);

  rpc GetBalance(GetBalanceRequest) returns (Balance);

  // Reserve funds while a payment is under fraud review. Idempotent on idempotency_key.
  rpc CreateHold(CreateHoldRequest) returns (Hold);

  // Give reserved funds back. Idempotent.
  rpc ReleaseHold(ReleaseHoldRequest) returns (Hold);
}

message Leg {
  string account_id = 1;  // UUID
  int64 amount = 2;       // paise; > 0 credit, < 0 debit
}

message PostJournalRequest {
  string idempotency_key = 1;
  string txn_type = 2;              // TRANSFER, QR_PAYMENT, DEPOSIT, ...
  repeated Leg legs = 3;
  string description = 4;
  map<string, string> metadata = 5;
  string capture_hold_id = 6;       // optional: post against a previously created hold
}

message Entry {
  string account_id = 1;
  int64 amount = 2;
  int64 balance_after = 3;
}

message PostJournalResponse {
  string journal_id = 1;
  bool replayed = 2;
  string txn_type = 3;
  repeated Entry entries = 4;
}

message GetBalanceRequest {
  string account_id = 1;
}

message Balance {
  string account_id = 1;
  string status = 2;           // OPEN, DEBIT_BLOCKED, CLOSED
  int64 ledger_balance = 3;
  int64 available_balance = 4;
  int64 overdraft_limit = 5;
}

message CreateHoldRequest {
  string idempotency_key = 1;
  string account_id = 2;
  int64 amount = 3;
  string reason = 4;
}

message ReleaseHoldRequest {
  string hold_id = 1;
}

message Hold {
  string hold_id = 1;
  string account_id = 2;
  int64 amount = 3;
  string status = 4;           // ACTIVE, RELEASED, CAPTURED, EXPIRED
}
