// Rate Limit Coordinator: shared rate-limit state and permit allocation,
// stored as CRDT counters in DynaStore.
//
// After editing this file run:  python scripts/gen_protos.py

syntax = "proto3";

package unbeatable.ratelimit.v1;

service RateLimitService {
  // Checks every descriptor against its policy and, if all pass, consumes `cost` permits from each.
  rpc Check(CheckRequest) returns (CheckResponse);
}

message Descriptor {
  string scope = 1;   // customer, account, device, ip
  string id = 2;
}

message CheckRequest {
  string policy_set = 1;            // "payments" (default) or "login"
  repeated Descriptor descriptors = 2;
  int64 cost = 3;                   // permits to consume; 0 means 1
  int64 amount = 4;                 // paise; used for the fail-open / fail-closed decision
}

message CheckResponse {
  bool allowed = 1;
  string limited_by = 2;            // scope that rejected the request
  int64 limit = 3;
  int64 remaining = 4;              // lowest remaining across descriptors
  int64 retry_after_seconds = 5;
  bool degraded = 6;                // DynaStore was unreachable; decision came from the fail policy
}
