name: Release

# Builds every service image, pushes it to Artifact Registry and writes the new
# image tag into deploy/bank/kustomization.yaml. ArgoCD sees that commit and
# rolls the pods: the deployment itself is done by GitOps, not by this workflow.
#
# One-time setup (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID      e.g. unbeatable-bank-12
#   GCP_REGION          e.g. us-central1
#   WIF_PROVIDER        output `github_wif_provider` of infra/bootstrap
#   CI_SERVICE_ACCOUNT  output `github_ci_service_account` of infra/bootstrap
# No keys are stored in GitHub: it authenticates with Workload Identity Federation.

on:
  push:
    branches: [main]
    paths: ["services/**", "libs/**", "proto/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/unbeatable

jobs:
  images:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        service: [ledger, account, intake, dynastore, ratelimit, risk, identity, gateway, fraud, deposits]
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Point the manifests at the new images
        run: python scripts/gen_manifests.py --registry "$REGISTRY" --tag "${{ github.sha }}"
      - name: Commit (this commit is what ArgoCD deploys)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/bank
          git diff --cached --quiet && { echo "nothing to deploy"; exit 0; }
          git commit -m "deploy: ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
