# Every payment decision (Transaction Intake). Consumed by the Flink job and Fraud Alert.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: txn-events
  labels:
    strimzi.io/cluster: bank-kafka
spec:
  topicName: txn-events
  partitions: 3
  replicas: 1
---
# Logins and security events (Identity). Consumed by Fraud Alert.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: auth-events
  labels:
    strimzi.io/cluster: bank-kafka
spec:
  topicName: auth-events
  partitions: 3
  replicas: 1
---
# RESULTS topic: suspicious patterns found by the Flink job.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: risk-signals
  labels:
    strimzi.io/cluster: bank-kafka
spec:
  topicName: risk-signals
  partitions: 3
  replicas: 1
---
# RESULTS topic: per-minute aggregates from the Flink job.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: analytics-results
  labels:
    strimzi.io/cluster: bank-kafka
spec:
  topicName: analytics-results
  partitions: 3
  replicas: 1
---
# Every posted journal (Ledger).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
