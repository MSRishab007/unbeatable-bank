metadata:
  name: ledger-hold-changed
  labels:
    strimzi.io/cluster: bank-kafka
spec:
  topicName: ledger.hold-changed
  partitions: 3
  replicas: 1
---
# Account lifecycle events (Account).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
