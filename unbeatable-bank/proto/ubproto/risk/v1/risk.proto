// Risk Detection: real-time, rule-based scoring of a payment.
//
// After editing this file run:  python scripts/gen_protos.py

syntax = "proto3";

package unbeatable.risk.v1;

service RiskService {
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
}

message EvaluateRequest {
  string txn_id = 1;
  string customer_id = 2;
  string from_account_id = 3;
  string to_account_id = 4;
  int64 amount = 5;                 // paise
  string channel = 6;               // TRANSFER, QR_PAYMENT
  string device_id = 7;
  string ip = 8;
  bool payee_trusted = 9;           // own account, or saved payee past its cooling period
  int32 account_idle_days = 10;     // days since the paying account was last used
  int64 event_time_ms = 11;         // 0 = now (set explicitly in tests and simulations)
}

message RuleHit {
  string rule = 1;
  int32 weight = 2;
  bool shadow = 3;                  // evaluated and logged, but not counted in the score
  string detail = 4;
}

message EvaluateResponse {
  int32 score = 1;                  // 0..100
  string decision = 2;              // ALLOW, CHALLENGE, HOLD, BLOCK
  repeated string reasons = 3;      // rule ids that counted towards the score
  repeated RuleHit hits = 4;
  bool degraded = 5;                // feature store unreachable
}
